# Pendolo with Docker Compose: the server, plus a runner that executes the
# scripts of shell steps in a separate, locked-down container.
#
#   1. Put your automations in ./automations (one folder each). The server
#      writes there when a builder draft is activated, as user 10001:
#        sudo chown -R 10001:10001 automations
#   2. Copy pendolo.example.yaml to pendolo.yaml and set your models.
#   3. Put secrets in ./secrets, one file per secret, and create the runner
#      token and the master key that encrypts secrets saved in the dashboard:
#        openssl rand -hex 24 > secrets/runner-token
#        openssl rand -base64 32 > secrets/pendolo-master-key
#   4. docker compose up -d, then open http://localhost:8080 and create the
#      owner with the setup token printed in `docker compose logs pendolo`.
services:
  pendolo:
    image: ${PENDOLO_IMAGE:-ghcr.io/enthonysclafani/pendolo:latest}
    build: ..
    restart: unless-stopped
    command: ["server", "--log-format", "json"]
    environment:
      PENDOLO_CONFIG: /etc/pendolo/pendolo.yaml
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - pendolo-data:/data
      # Read-write: activating a draft from the AI builder writes its folder.
      - ./automations:/automations
      - ./pendolo.yaml:/etc/pendolo/pendolo.yaml:ro
      - ./secrets:/run/secrets:ro
    ports:
      # Dashboard, API, health and webhooks. Publish beyond localhost only
      # behind a reverse proxy with TLS (and set server.trustProxy).
      - "127.0.0.1:8080:8080"
    depends_on:
      - runner

  # Runs scripts only. It sees the automations and its token, nothing else:
  # no database, no configuration, no other secrets, read-only file system.
  runner:
    image: ${PENDOLO_IMAGE:-ghcr.io/enthonysclafani/pendolo:latest}
    restart: unless-stopped
    command: ["runner"]
    environment:
      PENDOLO_AUTOMATIONS_DIR: /automations
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./automations:/automations:ro
      - ./secrets/runner-token:/run/secrets/runner-token:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s

volumes:
  pendolo-data:
