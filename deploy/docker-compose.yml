# Pendolo with Docker Compose.
#
#   1. Put your automations in ./automations (one folder each).
#   2. Copy pendolo.example.yaml to pendolo.yaml and set your models.
#   3. Put secrets in ./secrets, one file per secret (e.g. ./secrets/anthropic-api-key).
#   4. docker compose up -d
services:
  pendolo:
    image: ghcr.io/enthonysclafani/pendolo:latest
    build: ..
    restart: unless-stopped
    command: ["server", "--log-format", "json"]
    environment:
      PENDOLO_CONFIG: /etc/pendolo/pendolo.yaml
      TZ: Europe/Rome
    volumes:
      - pendolo-data:/data
      - ./automations:/automations:ro
      - ./pendolo.yaml:/etc/pendolo/pendolo.yaml:ro
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pendolo-data:
